# Model names are assumptions to verify against provider docs (see docs/ASSUMPTIONS.md).
models:
  router: {provider: gemini, model: "gemini-2.5-flash"}
  main:   {provider: gemini, model: "gemini-2.5-flash"}
  judge:  {provider: gemini, model: "gemini-2.5-flash"}
embeddings: {provider: gemini, model: "gemini-embedding-001"}
corpus: {path: data/sample}        # switch to data/corpus for the real corpus
retrieval: {top_k: 6, min_score: 0.0}   # calibrate from outputs/calibration.md
verifier: {llm_judge: true, max_regenerations: 1}
escalation:
  high_amount_inr: 500000
  limitation_warn_months: 30
  keywords_en: [arrest, arrested, police, fir, summons, "court notice", bail, violence, beat, beating, threat, threaten, threatened, harass, harassment, "locked out", "lock out", evict, eviction, divorce, custody, maintenance, alimony, inheritance, will, "property ownership", minor, "my child", cheque bounce, "cheque bounced"]
  keywords_hi: ["गिरफ्तार", "पुलिस", "एफआईआर", "समन", "जमानत", "हिंसा", "मारपीट", "धमकी", "धमका", "परेशान", "ताला", "बेदखल", "तलाक", "कस्टडी", "गुजारा भत्ता", "विरासत", "वसीयत", "नाबालिग", "चेक बाउंस"]
llm: {min_interval_s: 4, max_retries: 3}
mock: false
languages: [en-IN, hi-IN]
covered_states: [UP]
voice: {stt: sarvam, tts: sarvam, stt_fallback: gemini}
# Interview swap example (replace the main block, no code change):
#   main: {provider: openai_compatible, model: "<their model>", base_url: "<their url>", api_key_env: "KUKU_API_KEY"}
