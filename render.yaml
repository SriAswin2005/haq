# Render Blueprint: one free web service built from the Dockerfile.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo. Then paste GEMINI_API_KEY when asked.
services:
  - type: web
    name: haq-ai-lawyer
    runtime: docker
    plan: free
    region: singapore          # closest Render region to India
    healthCheckPath: /api/meta # no AI call, so health checks never use the Gemini quota
    autoDeploy: true           # redeploys on every push to the default branch
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # secret: entered in the dashboard, never stored in git
      - key: SARVAM_API_KEY    # optional paid voice backup; leave empty to use Google voice only
        sync: false
